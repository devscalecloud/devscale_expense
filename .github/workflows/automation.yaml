name: automatically builds and pushes the Docker image on push
on: push


jobs:
  test_the_application:    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository using actions/checkout@v7
        uses: actions/checkout@v7

      - name: Install Go (setup Go on the runner). using actions/setup-go@v7
        uses: actions/setup-go@v7
        with:
          go-version: '1.25' # The Go version to download (if necessary) and use.

      - name: Step that runs go test
        run: go test ./...


  build_app_and_upload_artifact:
    runs-on: ubuntu-latest
    needs: [test_the_application]
    steps:
      - name: Checkout repository using actions/checkout@v7
        uses: actions/checkout@v7

      - name: Install Go (setup Go on the runner). using actions/setup-go@v7
        uses: actions/setup-go@v7
        with:
          go-version: '1.25' # The Go version to download (if necessary) and use.
   # Sign in to Docker Hub using stored secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.PETER_DOCKER_USERNAME }}
          password: ${{ secrets.PETER_DOCKER_PASSWORD }}
  # Read the Dockerfile, build the image, upload it
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: erons064/devscale-expense-repo:v1
   
   
          
